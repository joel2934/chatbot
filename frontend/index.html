<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Company AI Assistant</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f7f8fc;
      --sidebar: #ffffff;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --message: #f3f4f6;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--background);
      color: var(--text);
    }

    #root {
      height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      transition: all 0.15s ease;
    }

    /* ---------------- APP ---------------- */

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: var(--background);
    }

    /* ---------------- SIDEBAR ---------------- */

    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--primary);
      color: white;

      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
    }

    .brand-text {
      font-size: 15px;
      font-weight: 700;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .new-chat-btn {
      width: 100%;

      padding: 10px 13px;

      background: var(--primary);
      color: white;

      border: none;
      border-radius: 8px;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .new-chat-btn:hover {
      background: var(--primary-dark);
    }

    /* ---------------- SEARCH ---------------- */

    .search-container {
      padding: 14px 16px 8px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;

      transform: translateY(-50%);

      color: #9ca3af;

      font-size: 13px;
    }

    .search-box {
      width: 100%;

      padding: 9px 10px 9px 32px;

      background: #f9fafb;

      border: 1px solid var(--border);
      border-radius: 8px;

      outline: none;

      font-size: 13px;
      color: var(--text);
    }

    .search-box:focus {
      border-color: #93c5fd;
      background: white;
    }

    /* ---------------- CHAT LIST ---------------- */

    .chat-section-title {
      padding: 12px 18px 7px;

      font-size: 11px;
      font-weight: 700;

      color: #9ca3af;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .chat-list {
      flex: 1;

      overflow-y: auto;

      padding: 3px 9px 15px;
    }

    .chat-item {
      display: flex;
      align-items: center;

      padding: 9px 10px;

      margin-bottom: 3px;

      border-radius: 7px;

      cursor: pointer;

      color: #374151;

      font-size: 13px;
    }

    .chat-item:hover {
      background: #f3f4f6;
    }

    .chat-item.active {
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
    }

    .chat-title {
      flex: 1;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .delete-btn {
      opacity: 0;

      border: none;
      background: transparent;

      color: #9ca3af;

      cursor: pointer;

      font-size: 13px;

      padding: 3px 5px;

      border-radius: 5px;
    }

    .chat-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    /* ---------------- MAIN ---------------- */

    .main {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-width: 0;
    }

    /* ---------------- HEADER ---------------- */

    .header {
      height: 62px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      background: white;

      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 12px;
      color: #6b7280;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      background: #22c55e;

      border-radius: 50%;
    }

    /* ---------------- DOCUMENT BAR ---------------- */

    .document-bar {
      display: flex;
      align-items: center;

      gap: 10px;

      padding: 9px 24px;

      background: #fafafa;

      border-bottom: 1px solid var(--border);
    }

    .knowledge-label {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 12px;
      font-weight: 600;

      color: #374151;
    }

    .document-count {
      margin-left: auto;

      font-size: 11px;

      color: var(--muted);
    }

    /* ---------------- MESSAGES ---------------- */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 28px 24px;

      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(720px, 75%);

      padding: 12px 15px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.55;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .message.user {
      background: var(--primary);
      color: white;

      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: white;

      border: 1px solid var(--border);

      color: #1f2937;

      border-bottom-left-radius: 4px;
    }

    .message-label {
      font-size: 10px;

      color: #9ca3af;

      margin-bottom: 5px;

      font-weight: 600;
    }

    /* ---------------- EMPTY STATE ---------------- */

    .empty-state {
      flex: 1;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 30px;

      color: var(--muted);
    }

    .empty-icon {
      width: 56px;
      height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: #eff6ff;

      color: var(--primary);

      font-size: 24px;

      margin-bottom: 15px;
    }

    .empty-title {
      font-size: 18px;

      font-weight: 700;

      color: #1f2937;

      margin-bottom: 6px;
    }

    .empty-description {
      font-size: 13px;

      text-align: center;

      max-width: 420px;

      line-height: 1.5;
    }

    /* ---------------- INPUT ---------------- */

    .input-area {
      padding: 14px 24px 18px;

      background: white;

      border-top: 1px solid var(--border);
    }

    .input-wrapper {
      display: flex;

      align-items: center;

      gap: 8px;

      max-width: 900px;

      margin: 0 auto;

      padding: 6px 6px 6px 14px;

      border: 1px solid #d1d5db;

      background: white;

      border-radius: 11px;

      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.04);
    }

    .input-wrapper:focus-within {
      border-color: #93c5fd;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    .message-input {
      flex: 1;

      border: none;

      outline: none;

      padding: 8px 0;

      font-size: 14px;

      color: #111827;

      background: transparent;
    }

    .message-input::placeholder {
      color: #9ca3af;
    }

    .send-btn {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;

      border-radius: 8px;

      background: var(--primary);

      color: white;

      cursor: pointer;

      font-size: 15px;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .send-btn:disabled {
      background: #dbeafe;

      color: #93c5fd;

      cursor: not-allowed;
    }

    .input-hint {
      max-width: 900px;

      margin: 7px auto 0;

      font-size: 10px;

      color: #9ca3af;

      text-align: center;
    }

    /* ---------------- RESPONSIVE ---------------- */

    @media (max-width: 760px) {

      .sidebar {
        width: 220px;
      }

      .messages {
        padding: 20px 15px;
      }

      .document-bar {
        padding: 9px 15px;
      }

      .header {
        padding: 0 15px;
      }

      .input-area {
        padding: 12px 15px;
      }

      .message {
        max-width: 88%;
      }

    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    const { useState, useEffect, useRef } = React;


    // Backend API
    const API_BASE = "http://localhost:8000";


    function App() {

      const [conversations, setConversations] = useState([]);

      const [activeId, setActiveId] = useState(null);

      const [messages, setMessages] = useState([]);

      const [documents, setDocuments] = useState([]);

      const [input, setInput] = useState("");

      const [searchTerm, setSearchTerm] = useState("");

      const [sending, setSending] = useState(false);

      const messagesEndRef = useRef(null);


      // Load conversations when application starts
      useEffect(() => {

        loadConversations();

      }, []);


      // Automatically scroll to latest message
      useEffect(() => {

        messagesEndRef.current?.scrollIntoView({
          behavior: "smooth"
        });

      }, [messages]);


      // --------------------------------------------------
      // LOAD CONVERSATIONS
      // --------------------------------------------------

      async function loadConversations() {

        try {

          const res = await fetch(
            `${API_BASE}/conversations`
          );

          if (!res.ok) {

            throw new Error(
              "Failed to load conversations"
            );

          }

          const data = await res.json();

          setConversations(data);

        } catch (error) {

          console.error(error);

          setConversations([]);

        }

      }


      // --------------------------------------------------
      // LOAD DOCUMENT INFORMATION
      // --------------------------------------------------

      async function loadDocuments(
        conversationId = null
      ) {

        try {

          const url = conversationId
            ? `${API_BASE}/documents?conversation_id=${encodeURIComponent(conversationId)}`
            : `${API_BASE}/documents`;

          const res = await fetch(url);

          if (!res.ok) {

            throw new Error(
              "Failed to load documents"
            );

          }

          const data = await res.json();

          setDocuments(data);

        } catch (error) {

          console.error(error);

          setDocuments([]);

        }

      }


      // --------------------------------------------------
      // CREATE NEW CHAT
      // --------------------------------------------------

      async function handleNewChat() {

        try {

          const res = await fetch(
            `${API_BASE}/conversations`,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                title: "New Chat"
              })
            }
          );

          const data = await res.json();

          if (!res.ok) {

            alert(
              data.detail ||
              "Failed to create conversation"
            );

            return;

          }

          await loadConversations();

          setActiveId(
            data.conversation_id
          );

          setMessages([]);

          setDocuments([]);

        } catch (error) {

          console.error(error);

          alert(
            "Could not create chat. Is the backend running?"
          );

        }

      }


      // --------------------------------------------------
      // OPEN EXISTING CONVERSATION
      // --------------------------------------------------

      async function openConversation(id) {

        try {

          setActiveId(id);

          const res = await fetch(
            `${API_BASE}/conversations/${id}`
          );

          const data = await res.json();

          setMessages(
            data.messages || []
          );

          await loadDocuments(id);

        } catch (error) {

          console.error(error);

        }

      }


      // --------------------------------------------------
      // SEARCH CONVERSATIONS
      // --------------------------------------------------

      async function handleSearch(term) {

        setSearchTerm(term);

        if (!term.trim()) {

          await loadConversations();

          return;

        }

        try {

          const res = await fetch(
            `${API_BASE}/conversations/search?q=${encodeURIComponent(term)}`
          );

          const data = await res.json();

          setConversations(data);

        } catch (error) {

          console.error(error);

        }

      }


      // --------------------------------------------------
      // DELETE CONVERSATION
      // --------------------------------------------------

      async function handleDeleteChat(id) {

        const confirmed = window.confirm(
          "Delete this conversation?"
        );

        if (!confirmed) {

          return;

        }

        try {

          const res = await fetch(
            `${API_BASE}/conversations/${id}`,
            {
              method: "DELETE"
            }
          );

          if (!res.ok) {

            const data = await res.json();

            alert(
              data.detail ||
              "Failed to delete conversation"
            );

            return;

          }

          if (id === activeId) {

            setActiveId(null);

            setMessages([]);

            setDocuments([]);

          }

          await loadConversations();

        } catch (error) {

          console.error(error);

          alert(
            "Could not delete conversation."
          );

        }

      }


      // --------------------------------------------------
      // SEND MESSAGE
      // --------------------------------------------------

      async function handleSend() {

        if (
          !input.trim() ||
          !activeId ||
          sending
        ) {

          return;

        }

        const question =
          input.trim();


        // Clear input immediately
        setInput("");

        // Disable send button while waiting
        setSending(true);


        // Immediately show user's message
        setMessages(prev => [

          ...prev,

          {
            role: "user",
            content: question,
            timestamp: new Date().toISOString()
          }

        ]);


        try {

          const res = await fetch(
            `${API_BASE}/conversations/${activeId}/messages`,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                content: question
              })
            }
          );


          const data = await res.json();


          // Backend returned an error
          if (!res.ok) {

            const errorMessage =
              data.detail ||
              "Something went wrong on the server.";


            setMessages(prev => [

              ...prev,

              {
                role: "assistant",

                content:
                  `Error: ${errorMessage}`
              }

            ]);

            return;

          }


          // Add assistant response
          setMessages(prev => [

            ...prev,

            data.assistant_message

          ]);


          /*
           * IMPORTANT:
           *
           * We intentionally DO NOT call:
           *
           * await loadConversations();
           *
           * here.
           *
           * Calling it after every message causes
           * unnecessary UI refreshing.
           */


        } catch (error) {

          console.error(error);


          setMessages(prev => [

            ...prev,

            {
              role: "assistant",

              content:
                "Error: Could not reach the backend server."
            }

          ]);


        } finally {

          setSending(false);

        }

      }


      // --------------------------------------------------
      // RENDER
      // --------------------------------------------------

      return (

        <div className="app">


          {/* ================= SIDEBAR ================= */}

          <aside className="sidebar">


            <div className="sidebar-header">


              <div className="brand">

                <div className="brand-icon">
                  AI
                </div>


                <div>

                  <div className="brand-text">
                    Company Assistant
                  </div>

                  <div className="brand-subtitle">
                    AI-powered knowledge assistant
                  </div>

                </div>

              </div>


              <button
                className="new-chat-btn"
                onClick={handleNewChat}
              >

                + New conversation

              </button>


            </div>


            {/* SEARCH */}

            <div className="search-container">

              <div className="search-wrapper">

                <span className="search-icon">
                  🔍
                </span>


                <input
                  className="search-box"

                  placeholder="Search conversations..."

                  value={searchTerm}

                  onChange={e =>
                    handleSearch(
                      e.target.value
                    )
                  }

                />

              </div>

            </div>


            {/* CONVERSATIONS */}

            <div className="chat-section-title">
              Conversations
            </div>


            <div className="chat-list">

              {conversations.length === 0 ? (

                <div
                  style={{
                    padding: "15px",
                    color: "#9ca3af",
                    fontSize: "12px",
                    textAlign: "center"
                  }}
                >

                  No conversations yet

                </div>

              ) : (

                conversations.map(
                  conversation => (

                    <div

                      key={
                        conversation.conversation_id
                      }

                      className={
                        "chat-item" +

                        (
                          conversation.conversation_id ===
                          activeId
                            ? " active"
                            : ""
                        )
                      }

                      onClick={() =>
                        openConversation(
                          conversation.conversation_id
                        )
                      }

                    >


                      <span className="chat-title">

                        {conversation.title}

                      </span>


                      <button

                        className="delete-btn"

                        onClick={event => {

                          event.stopPropagation();

                          handleDeleteChat(
                            conversation.conversation_id
                          );

                        }}

                        title="Delete conversation"

                      >

                        🗑

                      </button>


                    </div>

                  )

                )

              )}

            </div>

          </aside>


          {/* ================= MAIN ================= */}

          <main className="main">


            {/* HEADER */}

            <header className="header">

              <div className="header-title">
                Company AI Assistant
              </div>


              <div className="connection-status">

                <span className="status-dot"></span>

                Backend connected

              </div>

            </header>


            {activeId ? (

              <>


                {/* ================= RAG KNOWLEDGE BAR ================= */}

                <div className="document-bar">

                  <div className="knowledge-label">

                    📚 Company Knowledge Base

                  </div>


                  <div className="document-count">

                    4 policies loaded

                  </div>

                </div>


                {/* ================= MESSAGES ================= */}

                <div className="messages">


                  {messages.length === 0 ? (

                    <div className="empty-state">


                      <div className="empty-icon">
                        ✦
                      </div>


                      <div className="empty-title">

                        How can I help you?

                      </div>


                      <div className="empty-description">

                        Ask questions about company
                        policies, HR, finance, IT
                        security, and compliance.

                      </div>


                    </div>

                  ) : (

                    messages.map(
                      (message, index) => (

                        <div

                          key={index}

                          className={
                            "message-row " +
                            message.role
                          }

                        >


                          <div>


                            <div
                              className={
                                "message-label"
                              }
                            >

                              {
                                message.role ===
                                "user"
                                  ? "You"
                                  : "Company Assistant"
                              }

                            </div>


                            <div

                              className={
                                "message " +
                                message.role
                              }

                            >

                              {message.content}

                            </div>


                          </div>


                        </div>

                      )

                    )

                  )}


                  <div ref={messagesEndRef} />

                </div>


                {/* ================= INPUT ================= */}

                <div className="input-area">


                  <div className="input-wrapper">


                    <input

                      className="message-input"

                      value={input}

                      onChange={e =>
                        setInput(
                          e.target.value
                        )
                      }


                      onKeyDown={e => {

                        if (
                          e.key === "Enter" &&
                          !e.shiftKey
                        ) {

                          e.preventDefault();

                          handleSend();

                        }

                      }}


                      placeholder={
                        sending
                          ? "Assistant is thinking..."
                          : "Ask something about the company..."
                      }


                      disabled={sending}

                    />


                    <button

                      className="send-btn"

                      onClick={handleSend}

                      disabled={
                        sending ||
                        !input.trim()
                      }

                      title="Send message"

                    >

                      {
                        sending
                          ? "..."
                          : "↑"
                      }

                    </button>


                  </div>


                  <div className="input-hint">

                    Press Enter to send

                  </div>


                </div>


              </>

            ) : (


              /* ================= WELCOME SCREEN ================= */

              <div className="empty-state">


                <div className="empty-icon">
                  ✦
                </div>


                <div className="empty-title">

                  Welcome to Company Assistant

                </div>


                <div className="empty-description">

                  Start a new conversation to ask
                  questions about company policies
                  and procedures.

                </div>


              </div>

            )}


          </main>


        </div>

      );

    }


    // --------------------------------------------------
    // START REACT APPLICATION
    // --------------------------------------------------

    ReactDOM
      .createRoot(
        document.getElementById("root")
      )
      .render(
        <App />
      );

  </script>

</body>

</html>
